[project]
name = "vael-paper"
version = "0.1.0"
description = "Server for The Vael Paper — scans edition directories and serves them to the reader"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "vaelkeep" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "pillow>=10.4",
]

[project.scripts]
vael-paper = "vael_paper.__main__:main"
vael-paper-export = "vael_paper.export:main"
vael-paper-check = "vael_paper.check:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx2>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vael_paper"]
