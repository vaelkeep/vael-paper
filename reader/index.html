<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>The Vael Paper</title>

    <!--
      Link-preview tags. These carry generic values so the dev server has
      something sane; `vael-paper-export` rewrites them per paper, filling in
      the masthead, the motto and absolute URLs. See server/vael_paper/export.py.
    -->
    <meta name="description" content="A newspaper for one reader: a front page, sections, an order, and an end." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Vael Paper" />
    <meta property="og:title" content="The Vael Paper" />
    <meta property="og:description" content="A newspaper for one reader: a front page, sections, an order, and an end." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Vael Paper" />
    <meta name="twitter:description" content="A newspaper for one reader: a front page, sections, an order, and an end." />
    <link rel="preload" href="/src/fonts/source-serif-4-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/playfair-display-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <div id="measure-host" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
